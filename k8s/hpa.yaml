apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-event-portal-hpa
  namespace: smart-event
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-event-portal
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
