apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-event-portal
  labels:
    app: smart-event-portal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-event-portal
  template:
    metadata:
      labels:
        app: smart-event-portal
    spec:
      containers:
        - name: smart-event-portal
          image: stuxnet12/smart-event-portal:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
