apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-event-portal
  namespace: smart-event
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: smart-event-portal
  template:
    metadata:
      labels:
        app: smart-event-portal
    spec:
      containers:
        - name: portal
          image: stuxnet12/smart-event:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-event-config
                  key: PORT
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
